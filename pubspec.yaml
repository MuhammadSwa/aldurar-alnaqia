name: aldurar_alnaqia
description: "تطبيق الدرر النقية يحتوى على أوراد الطريقة اليسرية الصديقية الشاذلية"
publish_to: "none" 

version: 1.0.1+7

environment:
  sdk: ">=3.3.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.0
  go_router: ^17.0.0
  shared_preferences: ^2.2.3
  geolocator: ^14.0.0
  hijri: ^3.0.0
  just_audio: ^0.10.0
  
  path_provider: ^2.1.3
  url_launcher: ^6.3.0
  pdfx: ^2.7.0
  background_downloader: ^9.1.1
  adhan_dart: ^2.0.0
  timezone: ^0.11.0
  permission_handler: 13.0.1
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  flutter_riverpod: ^3.3.2
  lucide_icons_flutter: ^3.1.20
  google_fonts: ^8.2.1
  lottie: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

  plugin_platform_interface: any
  url_launcher_platform_interface: any
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "app_logo_cropped.png"
  image_path_android: "app_logo_cropped.png"
  image_path_ios: "app_icon_ios.png"
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  min_sdk_android: 21 
  web:
    generate: true
    image_path: "app_logo_cropped.png"
    background_color: "#ffffff"
    theme_color: "#0B6B4F"
  windows:
    generate: true
    image_path: "app_logo_cropped.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "app_logo_cropped.png"

flutter:
  uses-material-design: true

  assets:
    - assets/pdfs/
    - assets/imgs/
    - assets/lottie/
    - assets/imgs/sunnah_midnight.png
    - assets/imgs/sunnah_last_third.png
    - assets/imgs/sunnah_duha.png
    - assets/icons/
    - assets/data/

  fonts:
    - family: NotoNaskh
      fonts:
        - asset: fonts/NotoNaskArabic.ttf
    - family: AmiriQuran
      fonts:
        - asset: fonts/DigitalKhatt.otf

dependency_overrides:
  # permission_handler_android 14 requires AGP 9 (ecosystem not migrated yet);
  # stay on the 13.x line while the project uses AGP 8.
  permission_handler_android: 13.0.1
